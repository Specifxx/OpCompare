name: TEMP store probe

# Temporary (2026-10-28, store audit): probes every store the sister sites
# track that OP Compare doesn't (and the registered stores that stopped
# reading), one runner per market, through the real readers and matcher
# (scripts/probe-stores.ts), and commits the logs to this branch for review.
# Removed before the branch is merged.

on:
  push:
    branches: [claude/project-thread-y2202w]
    paths: [probe-in/**, .github/workflows/probe-stores-tmp.yml]

permissions:
  contents: write

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 300
    strategy:
      fail-fast: false
      matrix:
        market: [AU, CA, EU, SG, UK, US, FIX]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: npx prisma generate
      - run: |
          mkdir -p probe-out
          split -l 12 probe-in/${{ matrix.market }}.txt chunk-
          for f in chunk-*; do
            timeout 1500 npx tsx scripts/probe-stores.ts $(cat "$f" | tr '\n' ' ') >> probe-out/${{ matrix.market }}.log 2>&1 || echo "CHUNK FAILED $f: $(cat "$f" | tr '\n' ' ')" >> probe-out/${{ matrix.market }}.log
          done
          tail -50 probe-out/${{ matrix.market }}.log
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: probe-${{ matrix.market }}
          path: probe-out/
          if-no-files-found: ignore

  commit:
    needs: probe
    if: always()
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: probe-out
          pattern: probe-*
          merge-multiple: true
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add probe-out
          git commit -m "TEMP probe results (run ${GITHUB_RUN_ID})"
          for i in 1 2 3; do git pull --rebase -q origin "$GITHUB_REF_NAME" && git push origin "HEAD:$GITHUB_REF_NAME" && exit 0; sleep 5; done
          exit 1
