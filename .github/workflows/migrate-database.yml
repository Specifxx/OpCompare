name: Migrate database

# One-off: copy OP Compare's PRIVATE state (accounts, entitlement, watches, alerts,
# collections, notifications, the inbox, counters, Meta, import runs, CardDemand)
# from the CURRENT Neon database (OP2, else the old DATABASE_URL) to the NEW one
# (OP3: a repository secret or variable), after creating the new database's
# schema. The public data (catalogue, offers, eBay) is not in Neon any more: it is
# the `snapshot` branch. See scripts/migrate-db.ts and DECISIONS.md
# "2026-10-19: A third Neon database (OP3)" (and 2026-10-08 for the first move).
#
#  - The old database is only READ. Nothing is deleted anywhere.
#  - Public tables (catalogue, offers, eBay) are not copied: they live in the snapshot.
#  - Safe to run again: it only adds rows that are new since the last run.
#  - It shares the import's concurrency group, so it never overlaps an import.
#    Never dispatch it within 07:00–08:10 or 19:00–20:10 UTC.
on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Dry run: create the schema and count rows, copy nothing"
        type: boolean
        default: false

concurrency:
  group: import-prices
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  migrate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check both databases are configured
        id: gate
        env:
          OLD: ${{ secrets.OP2 || vars.OP2 || secrets.DATABASE_URL }}
          NEW: ${{ secrets.OP3 || vars.OP3 }}
        run: |
          if [ -z "$NEW" ]; then echo "::error::OP3 is not set as a repository secret or variable — nothing to migrate to."; exit 1; fi
          if [ -z "$OLD" ]; then echo "::error::OP2 (the current database) is not set — nothing to copy from."; exit 1; fi
          if [ "$OLD" = "$NEW" ]; then echo "::error::OP3 and the current database are the same."; exit 1; fi
          echo "Both databases are configured."
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      # Creates the tables in the new database (additive; no --accept-data-loss).
      - name: Create the schema in the new database
        env:
          OP3: ${{ secrets.OP3 || vars.OP3 }}
          DATABASE_URL: ${{ secrets.OP2 || vars.OP2 || secrets.DATABASE_URL }}
        run: bash scripts/db-push-safe.sh && npm run db:generate
      - name: Copy the state
        env:
          SOURCE_DATABASE_URL: ${{ secrets.OP2 || vars.OP2 || secrets.DATABASE_URL }}
          TARGET_DATABASE_URL: ${{ secrets.OP3 || vars.OP3 }}
          DRY: ${{ inputs.dry_run && '--dry' || '' }}
        run: npx tsx scripts/migrate-db.ts $DRY
