name: Import prices

# The twice-daily One Piece price import (scripts/import.ts):
#   07:00 UTC — before the 08:00 production release, so it builds on fresh prices
#   19:00 UTC — after TCGCSV's daily TCGplayer refresh (~20:00 UTC the day before
#               is already in; this run picks up the stores' afternoon changes)
# It writes ONLY to the OP Compare database (secret DATABASE_URL) and never calls
# eBay: the eBay pass is ebay-prices.yml (05:37 / 17:37), whose rows this import
# aggregates. This job never holds the eBay credentials. Without the secret it is a no-op, so the repo can be pushed
# before the database exists.
on:
  schedule:
    - cron: "7 7 * * *"
    - cron: "7 19 * * *"
  workflow_dispatch:
    inputs:
      stores:
        description: "Read the stores too (uncheck for a ~30 s catalogue + TCGplayer run)"
        type: boolean
        default: true
      only_stores:
        description: "Comma-separated store keys to read (blank = all)"
        type: string
        required: false

concurrency:
  group: import-prices
  cancel-in-progress: false

# Writes the price history to the `data` branch (lib/history.ts), so it needs
# to push.
permissions:
  contents: write

jobs:
  import:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      CRON_SECRET: ${{ secrets.CRON_SECRET }}
      REVALIDATE_URL: ${{ format('{0}/api/revalidate', vars.SITE_URL || 'https://opcompare.app') }}
      NEXT_PUBLIC_SITE_URL: ${{ vars.SITE_URL || 'https://opcompare.app' }}
      IMPORT_STORES: ${{ (github.event_name != 'workflow_dispatch' || inputs.stores) && '1' || '0' }}
      IMPORT_ONLY_STORES: ${{ inputs.only_stores }}
      HISTORY_DIR: .data/history
      SKIP_REVALIDATE: "1"
    steps:
      - name: Skip when the database is not configured
        id: gate
        run: |
          if [ -z "$DATABASE_URL" ]; then
            echo "DATABASE_URL secret is not set — nothing to import."
            echo "run=false" >> "$GITHUB_OUTPUT"
          else
            echo "run=true" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/checkout@v4
        if: steps.gate.outputs.run == 'true'
      - uses: actions/setup-node@v4
        if: steps.gate.outputs.run == 'true'
        with:
          node-version: 20
          cache: npm
      - run: npm ci
        if: steps.gate.outputs.run == 'true'
      # Creates the tables on the first run; later runs apply additive schema
      # changes. A destructive change fails here (no --accept-data-loss) rather
      # than dropping data.
      - name: Sync schema
        if: steps.gate.outputs.run == 'true'
        run: bash scripts/db-push-safe.sh && npx prisma generate
      # The history lives on the `data` branch, not in Postgres. Check it out
      # into .data (an orphan branch, created on the first run).
      - name: Check out the history branch
        if: steps.gate.outputs.run == 'true'
        env:
          REMOTE: https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git
        run: |
          if git ls-remote --exit-code --heads "$REMOTE" data >/dev/null 2>&1; then
            git clone --quiet --depth 1 --branch data --single-branch "$REMOTE" .data
          else
            mkdir -p .data && cd .data && git init --quiet -b data && git remote add origin "$REMOTE"
            # Vercel must never try to build this branch.
            printf '{\n  "git": { "deploymentEnabled": false }\n}\n' > vercel.json
            printf '# OP Compare price history\n\nWritten twice a day by the Import prices workflow on main. See src/lib/history.ts there for the format.\n' > README.md
          fi
      - name: Import
        if: steps.gate.outputs.run == 'true'
        run: npx tsx scripts/import.ts
      # Scrapers that broke quietly (lib/store-health.ts): a summary table and
      # up to 20 warnings in this run's log. Never fails the import.
      - name: Store health report
        if: steps.gate.outputs.run == 'true'
        continue-on-error: true
        run: npx tsx scripts/store-health.ts
      - name: Publish the history
        if: steps.gate.outputs.run == 'true'
        run: |
          cd .data
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if ! git diff --cached --quiet; then
            git commit --quiet -m "History $(date -u +%F) $(date -u +%H:%M)"
            git push --quiet origin data
          fi
          echo "HISTORY_REF=$(git rev-parse HEAD)" >> "$GITHUB_ENV"
      - name: Point the site at it and refresh
        if: steps.gate.outputs.run == 'true'
        run: npx tsx scripts/publish-history.ts
