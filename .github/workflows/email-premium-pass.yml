name: Premium 3-day pass batch

# One batch of the 3-day Premium pass email to OP Compare accounts that are not Premium (scripts/premium-gift-pass.ts;
# owner, 2026-11-27). Dispatch only, never scheduled. Dry run by default. Each email grants the pass, nobody gets two, and
# sends stop by themselves on 1 Dec 2026, 12:00 UTC.
on:
  workflow_dispatch:
    inputs:
      limit:
        description: "Accounts in this batch (at most 90)"
        type: string
        default: "60"
      dry:
        description: "1 = count only, 0 = send"
        type: choice
        options: ["1", "0"]
        default: "1"
      grant_only:
        description: "1 = grant the pass and hand back the addresses ENCRYPTED to `cert` (the Gmail route), no mail"
        type: choice
        options: ["0", "1"]
        default: "0"
      cert:
        description: "grant_only: a PEM certificate, base64 (public; the batch is encrypted to it)"
        type: string
        default: ""

permissions:
  contents: read

concurrency:
  group: email
  cancel-in-progress: false

jobs:
  send:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      DATABASE_URL: ${{ secrets.OP2 || vars.OP2 || secrets.OP3 || vars.OP3 || secrets.DATABASE_URL }}
      RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
      BREVO_API_KEY: ${{ secrets.BREVO_API_KEY }}
      EMAIL_FROM: ${{ secrets.EMAIL_FROM }}
      EMAIL_LINK_SECRET: ${{ secrets.EMAIL_LINK_SECRET }}
      EMAIL_REPLY_TO: ${{ vars.EMAIL_REPLY_TO }}
      NEXT_PUBLIC_SITE_URL: ${{ vars.SITE_URL || 'https://opcompare.app' }}
      LIMIT: ${{ inputs.limit }}
      DRY_RUN: ${{ inputs.dry }}
      GRANT_ONLY: ${{ inputs.grant_only }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run db:generate
      - name: Send one batch
        run: npx tsx scripts/premium-gift-pass.ts
      - name: Encrypt the granted batch (grant_only)
        if: inputs.grant_only == '1'
        env:
          CERT_B64: ${{ inputs.cert }}
        run: |
          test -n "$CERT_B64" || { echo "cert is required"; rm -f gift-batch.json; exit 1; }
          echo "$CERT_B64" | base64 -d > cert.pem
          openssl cms -encrypt -binary -aes256 -in gift-batch.json -out gift-batch.enc -outform DER cert.pem
          shred -u gift-batch.json
      - name: Upload the encrypted batch
        if: inputs.grant_only == '1'
        uses: actions/upload-artifact@v4
        with:
          name: gift-batch
          path: gift-batch.enc
          retention-days: 1
      - name: Print the encrypted batch (grant_only; ciphertext only)
        if: inputs.grant_only == '1'
        run: base64 -w0 gift-batch.enc; echo
