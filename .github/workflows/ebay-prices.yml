name: eBay prices

# The daily eBay pass (scripts/ebay.ts): searches OP Compare's OWN eBay
# application's Browse API for the (product, market) pairs that are due, and
# writes each pair's row as soon as its search completes.
#   12:37 UTC — the middle of eBay's quota day (07:00 to 07:00 UTC): a delayed
#               cron cannot slip into the next day, and the 19:07 import
#               publishes the fresh eBay rows
# Exactly the 2,500 Browse calls a day OP Compare may spend (lib/ebay-plan.ts
# DAILY_CALL_CAP, owner 2026-10-07 and 2026-10-09 "use all of it every day"),
# counted per eBay quota day and including any dispatch; each run spends
# min(EBAY_MAX_CALLS (2,500), liveRemaining − EBAY_QUOTA_RESERVE (300),
# 2,500 − our spend since 07:00 UTC). It always spends the lot: due pairs first,
# then the dearest cards' next refreshes, so no quota is left over.
#
# OFF until the repository secrets EBAY_CLIENT_ID and EBAY_CLIENT_SECRET hold OP
# Compare's own App ID and Cert ID (never RiftCompare's, never on Vercel): the
# gate job then skips the eBay job and the run is green. Set but refused
# by eBay → the run fails red after zero Browse calls; searches failing without
# a 429 (an outage, a keyset not approved for Browse) stop the run after 10 in
# a row and fail it red (lib/ebay-plan.ts FailureBreaker).
#
# The `ebay` job shares the import's concurrency group, so the two never
# overlap. A GitHub group holds one running and ONE pending run, and a newly
# queued run cancels the pending one: never dispatch this within 07:00–08:10 or
# 19:00–20:10 UTC, or it can cancel an import waiting behind it (docs/SETUP.md).
# The `gate` job is outside the group, so an unconfigured run never enters it.
on:
  schedule:
    - cron: "37 12 * * *"
  workflow_dispatch:
    inputs:
      force:
        description: "EBAY_FORCE=1: re-search every eligible pair (tick after a matching change). Never dispatch 07:00–08:10 or 19:00–20:10 UTC."
        type: boolean
        default: false
      only_market:
        description: "One of US UK AU EU CA SG (blank = all)"
        type: string
        required: false
      only_name:
        description: "Only products whose name contains this text (with force: re-search just those after a matching fix)"
        type: string
        required: false
      max_calls:
        description: "Lower the run's budget to N calls (smoke test: 50). Can never raise it."
        type: string
        required: false

# Pushes only the `snapshot` branch (the public data's one persistent copy: the
# eBay pass seeds from it and publishes its result back, in the import's
# concurrency group so the two never publish from the same seed). The `data`
# branch (price history) stays the import's.
permissions:
  contents: write

jobs:
  # Decides whether there is anything to do. It holds no concurrency group, so
  # while eBay is off (no secrets) a scheduled run never enters the import's
  # group and can never cancel an import waiting there.
  gate:
    runs-on: ubuntu-latest
    outputs:
      run: ${{ steps.gate.outputs.run }}
    steps:
      - name: Skip unless eBay and the database are configured
        id: gate
        env:
          DATABASE_URL: ${{ secrets.OP3 || vars.OP3 || secrets.OP2 || vars.OP2 || secrets.DATABASE_URL }}
          EBAY_CLIENT_ID: ${{ secrets.EBAY_CLIENT_ID }}
          EBAY_CLIENT_SECRET: ${{ secrets.EBAY_CLIENT_SECRET }}
        run: |
          if [ -z "$DATABASE_URL" ] || [ -z "$EBAY_CLIENT_ID" ] || [ -z "$EBAY_CLIENT_SECRET" ]; then
            echo "eBay not configured (or no DATABASE_URL) — skipping (0 calls)."
            echo "run=false" >> "$GITHUB_OUTPUT"
          else
            echo "run=true" >> "$GITHUB_OUTPUT"
          fi
          exit 0

  ebay:
    needs: gate
    if: needs.gate.outputs.run == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 120
    # The public working copy (lib/pubdb.ts): a throwaway Postgres seeded from the
    # `snapshot` branch, searched into, and published back to it.
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: pub
          POSTGRES_DB: pub
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    # The import's group, so the two never overlap (see the header).
    concurrency:
      group: import-prices
      cancel-in-progress: false
    # No secret at job level: npm ci's install scripts never see one. Each step
    # gets only what it needs.
    env:
      PUBLIC_DATABASE_URL: postgresql://postgres:pub@localhost:5432/pub
      NODE_OPTIONS: --max-old-space-size=4096
      EBAY_QUOTA_RESERVE: ${{ vars.EBAY_QUOTA_RESERVE }}
      EBAY_MAX_CALLS: ${{ vars.EBAY_MAX_CALLS }}
      EBAY_MIN_VALUE_CENTS: ${{ vars.EBAY_MIN_VALUE_CENTS }}
      EBAY_REFRESH: ${{ github.event_name != 'push' }}
      EBAY_FORCE: ${{ inputs.force && '1' || '' }}
      EBAY_ONLY_MARKET: ${{ inputs.only_market }}
      EBAY_ONLY_NAME: ${{ inputs.only_name }}
      EBAY_DISPATCH_CAP: ${{ inputs.max_calls }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      # The same additive sync as import-prices.yml (no --accept-data-loss).
      - name: Sync schema
        env:
          DATABASE_URL: ${{ secrets.OP3 || vars.OP3 || secrets.OP2 || vars.OP2 || secrets.DATABASE_URL }}
        run: bash scripts/db-push-safe.sh && npm run db:generate
      - name: Seed the public working copy from the snapshot
        id: seed
        run: bash scripts/pub-setup.sh
      - name: eBay pass
        id: pass
        env:
          DATABASE_URL: ${{ secrets.OP3 || vars.OP3 || secrets.OP2 || vars.OP2 || secrets.DATABASE_URL }}
          EBAY_CLIENT_ID: ${{ secrets.EBAY_CLIENT_ID }}
          EBAY_CLIENT_SECRET: ${{ secrets.EBAY_CLIENT_SECRET }}
          EBAY_AFFILIATE_CAMPAIGN: ${{ secrets.EBAY_AFFILIATE_CAMPAIGN }}
        run: npx tsx scripts/ebay.ts
      # Publish whatever the pass wrote, even when it stopped red (the failure
      # breaker, a 429, a timeout): the pairs it completed live only in the working
      # copy until this step, and the eBay pass's memory of what it searched with
      # them. Skipped when the seed itself failed (nothing to publish) or the
      # run was cancelled. A failure here fails the run: unpublished work is lost.
      - name: Build the price snapshot
        id: snapshot
        if: ${{ !cancelled() && steps.seed.outcome == 'success' && steps.pass.outcome != 'skipped' }}
        env:
          # Two facts about runs (when the last import finished, whether this pass ran lately): the only thing read from Neon.
          DATABASE_URL: ${{ secrets.OP3 || vars.OP3 || secrets.OP2 || vars.OP2 || secrets.DATABASE_URL }}
          SNAPSHOT_DIR: .snapshot-out
        run: npx tsx scripts/price-snapshot.ts
      - name: Publish the price snapshot
        if: ${{ !cancelled() && steps.snapshot.outcome == 'success' }}
        env:
          REMOTE: https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git
          SNAPSHOT_DIR: .snapshot-out
        run: bash scripts/publish-snapshot.sh
